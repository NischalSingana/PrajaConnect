server.port=${PORT:3000}

# ── DataSource ──────────────────────────────────────────────────────
# Accepts either SPRING_DATASOURCE_URL (jdbc:postgresql://...) or
# the raw Neon DATABASE_URL (postgresql://...) — the app auto-converts.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Jackson / Date serialization ────────────────────────────────────
# Serialize LocalDateTime as ISO-8601 strings, not numeric arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Multipart (image uploads) ────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Clerk JWT (OAuth2 Resource Server) ───────────────────────────────
# CLERK_JWKS_URI = https://<your-clerk-frontend-api>/.well-known/jwks.json
# Find it in Clerk Dashboard -> API Keys -> Advanced -> JWKS Endpoint
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI}

# ── Cloudflare R2 ────────────────────────────────────────────────────
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME:prajaconnect}
r2.public-url=${R2_PUBLIC_URL}

# ── AI Models ────────────────────────────────────────────────────────
groq.api-key=${GROQ_API_KEY}
gemini.api-key=${GEMINI_API_KEY}

# ── Clerk Admin ──────────────────────────────────────────────────────
clerk.secret-key=${CLERK_SECRET_KEY}

# ── CORS ─────────────────────────────────────────────────────────────
# Comma-separated list of trusted frontend origins
# In production: set CORS_ALLOWED_ORIGINS=https://your-domain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
